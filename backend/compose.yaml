services:
  graphdb:
    image: ontotext/graphdb:10.8.8
    ports:
      - "127.0.0.1:7200:7200"
    environment:
      GDB_JAVA_OPTS: "-Xms512m -Xmx2g"
    volumes:
      - graphdb-data:/opt/graphdb/home
    restart: unless-stopped
  graphdb-init:
    image: curlimages/curl:8.12.1
    depends_on:
      graphdb:
        condition: service_started
    volumes:
      - ./graphdb/repository.ttl:/config/repository.ttl:ro
      - ./scripts/init-repository.sh:/init-repository.sh:ro
    entrypoint: ["/bin/sh", "/init-repository.sh"]
    environment:
      GRAPHDB_SERVER: http://graphdb:7200
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GRAPHDB_URL: http://graphdb:7200/repositories/libros
    depends_on:
      graphdb-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  graphdb-data:
